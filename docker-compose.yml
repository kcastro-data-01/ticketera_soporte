services:
  ticketera:
    build: .
    ports:
      - "8000:8000"
    environment:
      # SQLite file inside the named volume so the data survives
      # `docker compose down` / rebuilds (change → new container).
      DATABASE_URL: sqlite:////data/ticketera.db
      # Asistente de IA: «qwen» (Qwen3 gratuito con Ollama, por defecto) o
      # «claude» (API de Claude, necesita ANTHROPIC_API_KEY). Se pueden
      # cambiar en un archivo .env junto a este archivo (no se sube a Git).
      ASISTENTE_PROVEEDOR: ${ASISTENTE_PROVEEDOR:-qwen}
      OLLAMA_URL: http://ollama:11434
      QWEN_MODELO: ${QWEN_MODELO:-qwen3:4b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ticketera-data:/data
    depends_on:
      - ollama

  # Servidor local de modelos abiertos; ejecuta Qwen3 sin costo por consulta.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Descarga el modelo la primera vez (unos 2,5 GB para qwen3:4b) y termina.
  # Las siguientes veces ya está en el volumen y no vuelve a descargar.
  ollama-descarga:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${QWEN_MODELO:-qwen3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ticketera-data:
  ollama-data:
