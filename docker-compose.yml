services:
  ticketera:
    build: .
    ports:
      - "8000:8000"
    environment:
      # SQLite file inside the named volume so the data survives
      # `docker compose down` / rebuilds (change → new container).
      DATABASE_URL: sqlite:////data/ticketera.db
      # Asistente de IA: «qwen» (Qwen3 gratuito con Ollama, por defecto) o
      # «claude» (API de Claude, necesita ANTHROPIC_API_KEY). Se pueden
      # cambiar en un archivo .env junto a este archivo (no se sube a Git).
      ASISTENTE_PROVEEDOR: ${ASISTENTE_PROVEEDOR:-qwen}
      OLLAMA_URL: http://ollama:11434
      QWEN_MODELO: ${QWEN_MODELO:-qwen3:0.6b}
      # Segundos máximos que se espera la respuesta del modelo.
      QWEN_TIMEOUT: ${QWEN_TIMEOUT:-90}
      # La IA redacta los conteos con los datos que calcula el servidor
      # (false: respuestas fijas del sistema, más rápidas en equipos lentos).
      ASISTENTE_REDACTAR_CON_IA: ${ASISTENTE_REDACTAR_CON_IA:-true}
      ASISTENTE_INTERPRETAR_CON_IA: ${ASISTENTE_INTERPRETAR_CON_IA:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Tickets por correo con Microsoft Graph (apagado por defecto).
      # Los datos van en .env; ver README → «Tickets por correo».
      CORREO_ACTIVO: ${CORREO_ACTIVO:-0}
      CORREO_USUARIO: ${CORREO_USUARIO:-}
      CORREO_M365_TENANT: ${CORREO_M365_TENANT:-}
      CORREO_M365_CLIENT_ID: ${CORREO_M365_CLIENT_ID:-}
      # Caché de tokens dentro del volumen: la sesión sobrevive reinicios.
      CORREO_M365_CACHE: /data/msal_cache.json
      CORREO_CARPETA_PROCESADOS: ${CORREO_CARPETA_PROCESADOS:-Tickets-Procesados}
      # «auto»: solo correos que piden ayuda; «todos»: buzón solo de soporte.
      CORREO_FILTRO: ${CORREO_FILTRO:-auto}
      CORREO_INTERVALO: ${CORREO_INTERVALO:-60}
      # Dirección con la que los demás abren la app (va en los correos).
      APP_URL: ${APP_URL:-http://localhost:8000}
    volumes:
      - ticketera-data:/data
    depends_on:
      - ollama

  # Servidor local de modelos abiertos; ejecuta Qwen3 sin costo por consulta.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Descarga el modelo la primera vez (unos 0,5 GB para qwen3:0.6b) y termina.
  # Las siguientes veces ya está en el volumen y no vuelve a descargar.
  ollama-descarga:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${QWEN_MODELO:-qwen3:0.6b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ticketera-data:
  ollama-data:
