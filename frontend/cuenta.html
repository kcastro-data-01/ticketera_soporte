<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta · American Data Networks</title>
  <!-- Modo oscuro guardado: se aplica antes de pintar (sin destello). -->
  <script>try{if(localStorage.getItem("tema")==="oscuro")document.documentElement.setAttribute("data-tema","oscuro")}catch(e){}</script>
  <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="app">
  <aside class="barra-lateral">
    <a href="index.html" class="marca">
      <img src="images/logo-circular.jpg" alt="" class="marca-logo">
      <span class="marca-texto">
        <span class="marca-nombre">American Data Networks</span>
        <span class="marca-sub">Sistema de tickets</span>
      </span>
    </a>
    <nav class="menu" aria-label="Menú principal">
      <a href="index.html" class="menu-enlace"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4z"/><path d="M13 5v2M13 11v2M13 17v2"/></svg><span>Tickets</span></a>
      <a href="crear.html" class="menu-enlace"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Nuevo ticket</span></a>
      <a href="historial.html" class="menu-enlace" data-permiso="historial_global"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg><span>Historial</span></a>
      <a href="metricas.html" class="menu-enlace" data-permiso="metricas"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Métricas</span></a>
      <a href="usuarios.html" class="menu-enlace" data-permiso="usuarios"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg><span>Usuarios</span></a>
      <a href="ayuda.html" class="menu-enlace"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg><span>Ayuda</span></a>
    </nav>
  </aside>

  <div class="app-principal">
    <header class="cabecera">
      <div>
        <h1>Mi cuenta</h1>
        <p>Sus datos y el cambio de contraseña</p>
      </div>
    </header>

    <main class="contenido">
      <section class="seccion" aria-label="Mis datos">
        <h2>Mis datos</h2>
        <div class="filtros detalle">
          <div class="campo-dato">
            <span class="etiqueta">Nombre</span>
            <span id="cuenta-nombre">—</span>
          </div>
          <div class="campo-dato">
            <span class="etiqueta">Correo</span>
            <span id="cuenta-email">—</span>
          </div>
          <div class="campo-dato">
            <span class="etiqueta">Rol</span>
            <span id="cuenta-rol">—</span>
          </div>
        </div>
      </section>

      <section class="seccion" aria-label="Cambiar contraseña">
        <h2>Cambiar contraseña</h2>
        <form id="form-password" class="filtros formulario" novalidate>
          <label class="campo">
            <span>Contraseña actual *</span>
            <input type="password" id="password-actual" required autocomplete="current-password">
          </label>
          <label class="campo">
            <span>Nueva contraseña *</span>
            <input type="password" id="password-nueva" required minlength="6" maxlength="72" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
          </label>
          <label class="campo">
            <span>Repita la nueva contraseña *</span>
            <input type="password" id="password-confirmar" required minlength="6" maxlength="72" autocomplete="new-password">
          </label>
          <div class="acciones">
            <button type="submit" id="guardar-password">Cambiar contraseña</button>
          </div>
        </form>
        <p id="estado-password" class="estado" role="status" aria-live="polite" hidden></p>
      </section>
    </main>

    <footer class="pie">© 2026 American Data Networks · Sistema de Tickets</footer>
  </div>

  <script src="js/auth.js" defer></script>
  <script src="js/asistente.js" defer></script>
  <script src="js/cuenta.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      requireAuth();
    });
  </script>
</body>
</html>
