<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · American Data Networks</title>
  <!-- Modo oscuro guardado: se aplica antes de pintar (sin destello). -->
  <script>try{if(localStorage.getItem("tema")==="oscuro")document.documentElement.setAttribute("data-tema","oscuro")}catch(e){}</script>
  <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    body.pagina-login {
      min-height: 100vh;
      background: var(--login-fondo);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      align-items: stretch;
      padding: 0;
      width: calc(100% - 2rem);
      max-width: 900px;
      background: var(--color-superficie);
      border: 1px solid var(--color-borde);
      border-radius: var(--radio-suave);
      box-shadow: var(--login-card-sombra);
      margin: 3rem auto;
      overflow: hidden;
    }
    .auth-container .login-izq {
      display: block;
      height: auto;
      position: relative;
      overflow: hidden;
      background: #0b184d;
    }
    .auth-container .login-izq::before {
      content: "";
      position: absolute;
      inset: -30px;
      background: url("images/login-sistema-tickets.jpg") center / cover no-repeat;
      filter: blur(28px);
    }
    .auth-container .login-izq .login-imagen {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 0;
      position: relative;
      z-index: 1;
    }
    .auth-container .login-der {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2.5rem;
      width: 100%;
    }
    /* Nombre del sistema arriba del formulario (logo y textos del menú). */
    .login-marca {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      width: 100%;
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--color-borde);
    }
    .login-marca img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
    }
    .login-marca-nombre {
      display: block;
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-texto);
      line-height: 1.25;
    }
    .login-marca-sub {
      display: block;
      margin-top: 0.1rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-tenue);
    }
    .auth-container .login-der .login-titulo {
      width: 100%;
      text-align: left;
      font-size: 1.35rem;
      color: var(--color-texto);
      font-weight: 600;
      margin: 0 0 1.25rem;
    }
    .auth-container .login-der .campo {
      position: relative;
      width: 100%;
      margin-bottom: 1rem;
    }
    .auth-container .login-der .campo .form-input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--color-borde-fuerte);
      border-radius: var(--radio-suave);
      font-size: 1rem;
      color: var(--color-texto);
      background: var(--color-fondo-neutro);
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }
    .auth-container .login-der .campo .form-input:focus {
      outline: none;
      border-color: var(--color-primario);
      background: var(--color-superficie);
      box-shadow: 0 0 0 3px var(--color-primario-foco);
    }
    .auth-container .login-der .toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--color-tenue);
    }
    .auth-container .login-der .btn-grp {
      display: flex;
      gap: 1rem;
      width: 100%;
      margin-top: 1.5rem;
    }
    .auth-container .login-der .btn-primario {
      flex: 1;
    }
    .auth-container .login-der .btn-secundario {
      flex: 1;
    }
    .auth-container .login-der .forgot-link {
      width: 100%;
      text-align: center;
      margin-top: 1rem;
      font-size: var(--texto-sm);
      color: var(--color-tenue);
    }
    .auth-container .login-der .login-footer {
      width: 100%;
      text-align: center;
      margin-top: 1rem;
      font-size: var(--texto-sm);
      color: var(--color-tenue);
    }
    .auth-tabs {
      position: static;
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      min-width: 180px;
    }
    .auth-tabs.active {
      display: flex;
    }
    .auth-tab {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--color-borde);
      border-radius: var(--radio-suave);
      background: var(--color-superficie);
      color: var(--color-tenue);
      font-weight: 600;
      font-size: var(--texto-sm);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .auth-tab.activo {
      background: var(--color-primario);
      color: #fff;
      border-color: var(--color-primario);
    }
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }
    .auth-form.activo {
      display: flex;
    }
    .auth-error {
      display: none;
      padding: 0.75rem 1rem;
      background: var(--color-error-fondo);
      color: var(--color-error);
      border-radius: var(--radio-suave);
      font-size: var(--texto-sm);
      width: 100%;
      margin-bottom: 1rem;
    }
    .auth-error.visible {
      display: block;
    }
    .auth-success {
      display: none;
      padding: 0.75rem 1rem;
      background: var(--color-exito-fondo);
      color: var(--color-exito);
      border-radius: var(--radio-suave);
      font-size: var(--texto-sm);
      width: 100%;
      margin-bottom: 1rem;
    }
    .auth-success.visible {
      display: block;
    }
    .btn-primario {
      background: var(--color-primario);
      color: #fff;
      border: none;
      padding: 0.8rem 1rem;
      border-radius: var(--radio-suave);
      font-weight: 600;
      font-size: var(--texto-sm);
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s;
      width: 100%;
      box-shadow: none;
    }
    .btn-primario:hover {
      background: var(--color-primario-oscuro);
    }
    .btn-primario:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-secundario {
      background: transparent;
      color: var(--color-primario-texto);
      border: 1px solid var(--color-primario);
      padding: 0.8rem 1rem;
      border-radius: var(--radio-suave);
      font-weight: 600;
      font-size: var(--texto-sm);
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }
    .btn-secundario:hover {
      background: var(--color-primario-tenue);
    }
    .auth-footer {
      width: 100%;
      text-align: center;
      margin-top: 1rem;
      font-size: var(--texto-sm);
      color: var(--color-tenue);
    }
    .auth-footer a {
      color: var(--color-enlace);
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .nota-registro {
      margin: 0 0 1rem;
      font-size: 0.85rem;
      color: var(--color-tenue);
    }
    .role-selector {
      display: none;
    }
    .role-selector.visible {
      display: flex;
    }
    .auth-container::before {
      display: none;
    }
    @media (max-width: 768px) {
      .auth-container {
        grid-template-columns: 1fr;
        padding: 0;
        margin: 0 auto;
      }
      .auth-container .login-izq {
        height: auto;
        margin-bottom: 0;
      }
      .auth-container .login-izq .login-imagen {
        width: 100%;
        height: 200px;
        border-radius: 0;
      }
      .auth-container .login-der {
        padding: 1rem;
      }
      .auth-container .login-der .login-titulo {
        margin-bottom: 1rem;
      }
      .auth-container .login-der .campo {
        margin-bottom: 0.75rem;
      }
      .auth-container .login-der .btn-grp {
        flex-direction: column;
      }
      .auth-container .login-der .btn-primario,
      .auth-container .login-der .btn-secundario {
        width: 100%;
      }
      .auth-tabs.active {
        display: flex;
        margin: 0.5rem 0 0;
      }
    }
  </style>
</head>
<body class="pagina-login">
  <div class="auth-container">
    <div class="login-izq">
      <img src="images/login-sistema-tickets.jpg" alt="American Data Networks" class="login-imagen">
    </div>
    <div class="login-der">
      <div class="login-marca">
        <img src="images/logo-circular.jpg" alt="">
        <span>
          <span class="login-marca-nombre">American Data Networks</span>
          <span class="login-marca-sub">Sistema de tickets</span>
        </span>
      </div>
      <h2 class="login-titulo">Iniciar sesión</h2>
      <div id="auth-error" class="auth-error" role="alert"></div>
      <div id="auth-success" class="auth-success" role="status"></div>
      <form id="form-login" class="auth-form activo">
        <div class="campo">
          <input type="email" id="login-email" name="email" required autocomplete="email" class="form-input" placeholder="tu@correo.com">
          <span class="field-icon email-icon"></span>
        </div>
        <div class="campo">
          <input type="password" id="login-password" name="password" required autocomplete="current-password" class="form-input" placeholder="••••••••">
          <span class="toggle-password" aria-label="Mostrar contraseña" title="Mostrar contraseña">⊘</span>
        </div>
        <div class="remember-me">
          <input type="checkbox" id="remember-me" name="remember-me">
          <span>Recordar sesión</span>
        </div>
        <div class="btn-grp">
          <button type="submit" id="btn-login" class="btn-primario">Entrar</button>
          <button type="button" id="tab-register" class="btn-secundario">Crear cuenta</button>
        </div>
      </form>

      <form id="form-register" class="auth-form" >
        
        <div class="campo">
          <input type="text" id="register-name" name="name" required class="form-input" placeholder="Nombre completo">
          <span class="field-icon"></span>
        </div>
        <div class="campo">
          <input type="email" id="register-email" name="email" required class="form-input" placeholder="nombre@soporte.local">
          <span class="field-icon email-icon"></span>
        </div>
        <div class="campo">
          <input type="password" id="register-password" name="password" required class="form-input" placeholder="Mínimo 6 caracteres">
          <span class="toggle-password" aria-label="Mostrar contraseña" title="Mostrar contraseña">⊘</span>
        </div>
        <div class="remember-me">
          <input type="checkbox" id="register-memory" name="remember-memory">
          <span>Recordar sesión</span>
        </div>
        <p class="nota-registro" id="nota-registro">
          Usa tu correo de la empresa. Tu cuenta se crea como <b>Solicitante</b>
          para que puedas reportar y seguir tus tickets.
        </p>
        <div class="btn-grp">
          <button type="submit" id="btn-register" class="btn-primario">Crear cuenta</button>
          <button type="button" id="tab-login" class="btn-secundario">Volver a iniciar sesión</button>
        </div>
      </form>

      <a href="index.html" class="forgot-link">¿Has olvidado tu contraseña? Contacta al administrador</a>
      <div class="login-footer">
      </div>
    </div>
  </div>

  <script>
    (function () {
      const API_BASE = "/api/auth";

      // Elementos del DOM
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const formLogin = document.getElementById("form-login");
      const formRegister = document.getElementById("form-register");
      const errorDiv = document.getElementById("auth-error");
      const successDiv = document.getElementById("auth-success");
      const btnLogin = document.getElementById("btn-login");
      const btnRegister = document.getElementById("btn-register");

      // Estado
      let isFirstUser = false;

      // --- Utilidades ---

      function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.classList.add("visible");
        successDiv.classList.remove("visible");
      }

      function showSuccess(msg) {
        successDiv.textContent = msg;
        successDiv.classList.add("visible");
        errorDiv.classList.remove("visible");
      }

      function clearMessages() {
        errorDiv.classList.remove("visible");
        successDiv.classList.remove("visible");
      }

      function setLoading(button, loading) {
        if (loading) {
          button.disabled = true;
          button.dataset.originalText = button.textContent;
          button.textContent = "Cargando...";
        } else {
          button.disabled = false;
          button.textContent = button.dataset.originalText;
        }
      }

      function saveSession(token, user) {
        localStorage.setItem("access_token", token);
        localStorage.setItem("user", JSON.stringify(user));
      }

      function redirectToIndex() {
        window.location.href = "index.html";
      }

      // --- Tabs ---

      function activateTab(tab) {
        if (tab === "login") {
          tabLogin.classList.add("activo");
          tabRegister.classList.remove("activo");
          formLogin.classList.add("activo");
          formRegister.classList.remove("activo");
          document.querySelector('.login-titulo').textContent = 'Iniciar sesión';
        } else {
          tabRegister.classList.add("activo");
          tabLogin.classList.remove("activo");
          formRegister.classList.add("activo");
          formLogin.classList.remove("activo");
          document.querySelector('.login-titulo').textContent =
            isFirstUser ? 'Crear administrador' : 'Crear cuenta';
        }
      }

      tabLogin.addEventListener("click", () => activateTab("login"));
      tabRegister.addEventListener("click", () => activateTab("register"));

      // --- Verificar si es el primer usuario ---

      async function checkFirstUser() {
        try {
          const resp = await fetch("/api/auth/register", { method: "OPTIONS" });
          // Si el método no está permitido, al menos sabemos que el endpoint existe
        } catch (e) {
          // No hacemos nada, el flujo normal maneja esto
        }
      }

      // --- Login ---

      async function handleLogin(event) {
        event.preventDefault();
        clearMessages();

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        if (!email || !password) {
          showError("Todos los campos son obligatorios.");
          return;
        }

        setLoading(btnLogin, true);

        try {
          const resp = await fetch(`${API_BASE}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          if (resp.status === 401) {
            showError("Credenciales inválidas. Verifica tu correo y contraseña.");
            return;
          }

          if (resp.status === 403) {
            showError("Tu cuenta está desactivada. Contacta al administrador.");
            return;
          }

          if (!resp.ok) {
            showError(`Error del servidor (${resp.status}). Intenta de nuevo.`);
            return;
          }

          const data = await resp.json();

          // Obtener información del usuario
          const meResp = await fetch(`${API_BASE}/me`, {
            headers: { Authorization: `Bearer ${data.access_token}` },
          });
          if (meResp.ok) {
            const user = await meResp.json();
            saveSession(data.access_token, user);
          } else {
            saveSession(data.access_token, { email });
          }

          showSuccess("¡Inicio de sesión exitoso! Redirigiendo...");
          setTimeout(redirectToIndex, 800);
        } catch (err) {
          showError("No se pudo conectar con el servidor. Verifica tu conexión.");
        } finally {
          setLoading(btnLogin, false);
        }
      }

      // --- Registro ---

      async function handleRegister(event) {
        event.preventDefault();
        clearMessages();

        const name = document.getElementById("register-name").value.trim();
        const email = document.getElementById("register-email").value.trim();
        const password = document.getElementById("register-password").value;
        if (!name || !email || !password) {
          showError("Todos los campos son obligatorios.");
          return;
        }

        if (password.length < 6) {
          showError("La contraseña debe tener al menos 6 caracteres.");
          return;
        }

        /* El primer usuario se crea como Administrador; los demás, el
           servidor siempre los crea como Solicitante. */
        const payload = { name, email, password };
        if (isFirstUser) payload.role = "Administrador";

        setLoading(btnRegister, true);

        try {
          const resp = await fetch(`${API_BASE}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (resp.status === 409) {
            showError("Este correo ya está registrado. Inicia sesión en su lugar.");
            return;
          }

          if (resp.status === 422) {
            const detail = await resp.json().catch(() => null);
            if (detail && detail.detail) {
              const msg = Array.isArray(detail.detail)
                ? detail.detail.map((e) => e.msg).join(", ")
                : detail.detail;
              showError(`Datos inválidos: ${msg}`);
            } else {
              showError("Datos inválidos. Verifica la información.");
            }
            return;
          }

          if (!resp.ok) {
            showError(`Error del servidor (${resp.status}). Intenta de nuevo.`);
            return;
          }

          const data = await resp.json();

          // Obtener información del usuario
          const meResp = await fetch(`${API_BASE}/me`, {
            headers: { Authorization: `Bearer ${data.access_token}` },
          });
          if (meResp.ok) {
            const user = await meResp.json();
            saveSession(data.access_token, user);
          } else {
            saveSession(data.access_token, { name, email });
          }

          showSuccess("¡Cuenta creada exitosamente! Redirigiendo...");
          setTimeout(redirectToIndex, 800);
        } catch (err) {
          showError("No se pudo conectar con el servidor. Verifica tu conexión.");
        } finally {
          setLoading(btnRegister, false);
        }
      }

      formLogin.addEventListener("submit", handleLogin);
      formRegister.addEventListener("submit", handleRegister);
      document.querySelectorAll(".toggle-password").forEach(el => el.addEventListener("click", () => { const i = el.parentElement.querySelector("input"); i.type = i.type === "password" ? "text" : "password"; }));
      // --- Inicialización ---

      // Primera vez (ningún usuario puede iniciar sesión): la cuenta que se
      // cree será el Administrador. Después, quien se registre es Solicitante.
      // El enlace del correo de bienvenida abre directo el registro
      // (login.html?registro=1&email=...).
      async function initCheck() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("email")) {
          document.getElementById("register-email").value = params.get("email");
        }
        try {
          const resp = await fetch(`${API_BASE}/setup`);
          if (resp.ok) {
            const data = await resp.json();
            if (data.needs_setup) {
              isFirstUser = true;
              tabRegister.textContent = "Crear administrador";
              btnRegister.textContent = "Crear administrador";
              document.getElementById("nota-registro").innerHTML =
                "Primera vez: esta cuenta será el <b>Administrador</b>.";
              activateTab("register");
              return;
            }
          }
        } catch (e) {
          isFirstUser = false;
        }
        if (params.get("registro")) activateTab("register");
      }

      initCheck();
    })();
  </script>
</body>
</html>
