<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · American Data Networks</title>
  <!-- Modo oscuro guardado: se aplica antes de pintar (sin destello). -->
  <script>try{if(localStorage.getItem("tema")==="oscuro")document.documentElement.setAttribute("data-tema","oscuro")}catch(e){}</script>
  <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    body.pagina-login {
      min-height: 100vh;
      background: var(--login-fondo);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      align-items: stretch;
      padding: 0;
      width: calc(100% - 2rem);
      max-width: 900px;
      background: var(--color-superficie);
      border: 1px solid var(--color-borde);
      border-radius: var(--radio-suave);
      box-shadow: var(--login-card-sombra);
      margin: 3rem auto;
      overflow: hidden;
    }
    .auth-container .login-izq {
      display: block;
      height: auto;
      position: relative;
      overflow: hidden;
      background: #0b184d;
    }
    .auth-container .login-izq::before {
      content: "";
      position: absolute;
      inset: -30px;
      background: url("images/login-sistema-tickets.jpg") center / cover no-repeat;
      filter: blur(28px);
    }
    .auth-container .login-izq .login-imagen {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 0;
      position: relative;
      z-index: 1;
    }
    .auth-container .login-der {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2.5rem;
      width: 100%;
    }
    /* Nombre del sistema arriba del formulario (logo y textos del menú). */
    .login-marca {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      width: 100%;
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--color-borde);
    }
    .login-marca img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
    }
    .login-marca-nombre {
      display: block;
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-texto);
      line-height: 1.25;
    }
    .login-marca-sub {
      display: block;
      margin-top: 0.1rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-tenue);
    }
    .auth-container .login-der .login-titulo {
      width: 100%;
      text-align: left;
      font-size: var(--texto-titulo);
      color: var(--color-titulo);
      font-weight: 600;
      margin: 0 0 1.25rem;
    }
    .auth-container .login-der .campo {
      position: relative;
      width: 100%;
      margin-bottom: 1rem;
    }
    .auth-container .login-der .campo .form-input {
      width: 100%;
      min-height: var(--alto-control);
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--color-borde-fuerte);
      border-radius: var(--radio-suave);
      font-size: var(--texto-md);
      color: var(--color-texto);
      background: var(--color-fondo-neutro);
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }
    .auth-container .login-der .campo .form-input:focus {
      outline: none;
      border-color: var(--color-primario);
      background: var(--color-superficie);
      box-shadow: 0 0 0 3px var(--color-primario-foco);
    }
    .auth-container .login-der .toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 0.25rem;
      border: 0;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      color: var(--color-tenue);
    }
    .auth-container .login-der .toggle-password:hover {
      background: transparent;
      color: var(--color-texto);
    }
    .auth-container .login-der .toggle-password svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .auth-container .login-der .btn-grp {
      display: flex;
      gap: 1rem;
      width: 100%;
      margin-top: 1.5rem;
    }
    .auth-container .login-der .btn-primario {
      flex: 1;
    }
    .auth-container .login-der .btn-secundario {
      flex: 1;
    }
    .auth-container .login-der .forgot-link {
      width: 100%;
      text-align: center;
      margin-top: 1rem;
      font-size: var(--texto-sm);
      color: var(--color-tenue);
    }
    .auth-container .login-der .login-footer {
      width: 100%;
      text-align: center;
      margin-top: 1rem;
      font-size: var(--texto-sm);
      color: var(--color-tenue);
    }
    .auth-tabs {
      position: static;
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      min-width: 180px;
    }
    .auth-tabs.active {
      display: flex;
    }
    .auth-tab {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--color-borde);
      border-radius: var(--radio-suave);
      background: var(--color-superficie);
      color: var(--color-tenue);
      font-weight: 600;
      font-size: var(--texto-sm);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .auth-tab.activo {
      background: var(--color-primario);
      color: #fff;
      border-color: var(--color-primario);
    }
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }
    .auth-form.activo {
      display: flex;
    }
    .auth-error {
      display: none;
      padding: 0.75rem 1rem;
      background: var(--color-error-fondo);
      color: var(--color-error);
      border-radius: var(--radio-suave);
      font-size: var(--texto-sm);
      width: 100%;
      margin-bottom: 1rem;
    }
    .auth-error.visible {
      display: block;
    }
    .auth-success {
      display: none;
      padding: 0.75rem 1rem;
      background: var(--color-exito-fondo);
      color: var(--color-exito);
      border-radius: var(--radio-suave);
      font-size: var(--texto-sm);
      width: 100%;
      margin-bottom: 1rem;
    }
    .auth-success.visible {
      display: block;
    }
    .btn-primario {
      background: var(--color-primario);
      color: #fff;
      border: none;
      min-height: var(--alto-control);
      padding: 0.4rem 1rem;
      border-radius: var(--radio-suave);
      font-weight: 600;
      font-size: var(--texto-md);
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s;
      width: 100%;
      box-shadow: none;
    }
    .btn-primario:hover {
      background: var(--color-primario-oscuro);
    }
    .btn-primario:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-secundario {
      background: transparent;
      color: var(--color-primario-texto);
      border: 1px solid var(--color-primario);
      min-height: var(--alto-control);
      padding: 0.4rem 1rem;
      border-radius: var(--radio-suave);
      font-weight: 600;
      font-size: var(--texto-md);
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }
    .btn-secundario:hover {
      background: var(--color-primario-tenue);
    }
    .auth-footer {
      width: 100%;
      text-align: center;
      margin-top: 1rem;
      font-size: var(--texto-sm);
      color: var(--color-tenue);
    }
    .auth-footer a {
      color: var(--color-enlace);
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .nota-login {
      margin: 0 0 1rem;
      font-size: 0.85rem;
      color: var(--color-tenue);
    }
    .btn-microsoft {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .btn-microsoft svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    #form-login {
      margin-top: 1.5rem;
    }
    .role-selector {
      display: none;
    }
    .role-selector.visible {
      display: flex;
    }
    .auth-container::before {
      display: none;
    }
    @media (max-width: 768px) {
      .auth-container {
        grid-template-columns: 1fr;
        padding: 0;
        margin: 0 auto;
      }
      .auth-container .login-izq {
        height: auto;
        margin-bottom: 0;
      }
      .auth-container .login-izq .login-imagen {
        width: 100%;
        height: 200px;
        border-radius: 0;
      }
      .auth-container .login-der {
        padding: 1rem;
      }
      .auth-container .login-der .login-titulo {
        margin-bottom: 1rem;
      }
      .auth-container .login-der .campo {
        margin-bottom: 0.75rem;
      }
      .auth-container .login-der .btn-grp {
        flex-direction: column;
      }
      .auth-container .login-der .btn-primario,
      .auth-container .login-der .btn-secundario {
        width: 100%;
      }
      .auth-tabs.active {
        display: flex;
        margin: 0.5rem 0 0;
      }
    }
  </style>
</head>
<body class="pagina-login">
  <div class="auth-container">
    <div class="login-izq">
      <img src="images/login-sistema-tickets.jpg" alt="American Data Networks" class="login-imagen">
    </div>
    <div class="login-der">
      <div class="login-marca">
        <img src="images/logo-circular.jpg" alt="">
        <span>
          <span class="login-marca-nombre">American Data Networks</span>
          <span class="login-marca-sub">Sistema de tickets</span>
        </span>
      </div>
      <h2 class="login-titulo">Iniciar sesión</h2>
      <div id="auth-error" class="auth-error" role="alert"></div>
      <div id="auth-success" class="auth-success" role="status"></div>
      <p class="nota-login">Use su cuenta de Microsoft de la empresa.</p>
      <div class="btn-grp">
        <button type="button" id="btn-microsoft" class="btn-primario btn-microsoft"><svg viewBox="0 0 21 21" aria-hidden="true"><path fill="#f25022" d="M1 1h9v9H1z"/><path fill="#7fba00" d="M11 1h9v9h-9z"/><path fill="#00a4ef" d="M1 11h9v9H1z"/><path fill="#ffb900" d="M11 11h9v9h-9z"/></svg>Iniciar sesión con Microsoft</button>
      </div>

      <!-- Solo para desarrollo (LOGIN_LOCAL=true en el .env): entrar con
           correo y contraseña. Por defecto no se muestra. -->
      <form id="form-login" class="auth-form">
        <div class="campo">
          <input type="email" id="login-email" name="email" required autocomplete="email" class="form-input" placeholder="nombre@empresa.com">
          <span class="field-icon email-icon"></span>
        </div>
        <div class="campo">
          <input type="password" id="login-password" name="password" required autocomplete="current-password" class="form-input" placeholder="••••••••">
          <button type="button" class="toggle-password" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="btn-grp">
          <button type="submit" id="btn-login" class="btn-secundario">Entrar con contraseña (desarrollo)</button>
        </div>
      </form>

      <div class="login-footer">
      </div>
    </div>
  </div>

  <!-- MSAL.js (versión fija, con hash de integridad): inicio de sesión con
       Microsoft, flujo de código con PKCE. -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"
          integrity="sha384-RGxxfG5yRS8DLU7ZJ8OoLhbV/BsJFHyPuMVHrTLbpj3t5Z15LnviJmaznKY/a7LZ"
          crossorigin="anonymous"></script>
  <script>
    (function () {
      const API_BASE = "/api/auth";
      // Solo lo que hace falta para iniciar sesión; User.Read ya tiene
      // consentimiento de administrador.
      const SCOPES = ["openid", "profile", "email", "User.Read"];

      const errorDiv = document.getElementById("auth-error");
      const successDiv = document.getElementById("auth-success");
      const btnMicrosoft = document.getElementById("btn-microsoft");
      const formLogin = document.getElementById("form-login");
      const btnLogin = document.getElementById("btn-login");

      let msalApp = null;

      // --- Utilidades ---

      function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.classList.add("visible");
        successDiv.classList.remove("visible");
      }

      function showSuccess(msg) {
        successDiv.textContent = msg;
        successDiv.classList.add("visible");
        errorDiv.classList.remove("visible");
      }

      function clearMessages() {
        errorDiv.classList.remove("visible");
        successDiv.classList.remove("visible");
      }

      function setLoading(button, loading) {
        if (loading) {
          button.disabled = true;
          button.dataset.originalText = button.innerHTML;
          button.textContent = "Cargando...";
        } else {
          button.disabled = false;
          button.innerHTML = button.dataset.originalText;
        }
      }

      function saveSession(token, user) {
        localStorage.setItem("access_token", token);
        localStorage.setItem("user", JSON.stringify(user));
      }

      // Con el token de la app: datos del usuario, sesión guardada y al listado.
      async function entrarConToken(accessToken, respaldo) {
        const meResp = await fetch(`${API_BASE}/me`, {
          headers: { Authorization: `Bearer ${accessToken}` },
        });
        saveSession(accessToken, meResp.ok ? await meResp.json() : respaldo);
        showSuccess("Inicio de sesión correcto. Redirigiendo…");
        setTimeout(() => { window.location.href = "index.html"; }, 800);
      }

      // --- Microsoft ---

      // El id_token de Microsoft va al backend, que lo valida (firma,
      // audiencia, emisor y tenant) y entrega la sesión de la app.
      async function entrarConMicrosoft(idToken) {
        const resp = await fetch(`${API_BASE}/microsoft`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id_token: idToken }),
        });
        if (resp.status === 403) {
          showError("Su cuenta está desactivada. Comuníquese con el administrador.");
          return;
        }
        if (resp.status === 401) {
          showError("No se pudo validar su cuenta. Use la cuenta de Microsoft de la empresa.");
          return;
        }
        if (!resp.ok) {
          showError(`Error del servidor (${resp.status}). Inténtelo de nuevo.`);
          return;
        }
        const data = await resp.json();
        await entrarConToken(data.access_token, {});
      }

      async function iniciarMicrosoft(config) {
        if (!window.msal || !config.tenant || !config.client_id) {
          btnMicrosoft.disabled = true;
          showError("El inicio de sesión con Microsoft no está disponible en este momento.");
          return;
        }
        msalApp = await msal.PublicClientApplication.createPublicClientApplication({
          auth: {
            clientId: config.client_id,
            authority: `https://login.microsoftonline.com/${config.tenant}`,
            redirectUri: `${window.location.origin}/login.html`,
          },
          cache: { cacheLocation: "sessionStorage" },
        });
        // Al volver de Microsoft (redirect) llega la respuesta con el id_token.
        const respuesta = await msalApp.handleRedirectPromise();
        if (respuesta && respuesta.idToken) {
          setLoading(btnMicrosoft, true);
          try {
            await entrarConMicrosoft(respuesta.idToken);
          } finally {
            setLoading(btnMicrosoft, false);
          }
        }
      }

      btnMicrosoft.addEventListener("click", async () => {
        clearMessages();
        if (!msalApp) return;
        try {
          // Flujo de código con PKCE (MSAL lo hace solo).
          await msalApp.loginRedirect({ scopes: SCOPES, prompt: "select_account" });
        } catch (err) {
          showError("No se pudo abrir el inicio de sesión de Microsoft.");
        }
      });

      // --- Contraseña (solo LOGIN_LOCAL, desarrollo) ---

      async function handleLogin(event) {
        event.preventDefault();
        clearMessages();

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;
        if (!email || !password) {
          showError("Ingrese su correo y su contraseña.");
          return;
        }

        setLoading(btnLogin, true);
        try {
          const resp = await fetch(`${API_BASE}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          if (resp.status === 401) {
            showError("Credenciales inválidas. Verifique su correo y contraseña.");
            return;
          }
          if (resp.status === 403) {
            showError("Su cuenta está desactivada. Comuníquese con el administrador.");
            return;
          }
          if (!resp.ok) {
            showError(`Error del servidor (${resp.status}). Inténtelo de nuevo.`);
            return;
          }
          const data = await resp.json();
          await entrarConToken(data.access_token, { email });
        } catch (err) {
          showError("No se pudo conectar con el servidor. Verifique su conexión.");
        } finally {
          setLoading(btnLogin, false);
        }
      }

      formLogin.addEventListener("submit", handleLogin);
      // Botón con aria-label y aria-pressed: también se usa con el teclado.
      document.querySelectorAll(".toggle-password").forEach(el => el.addEventListener("click", () => {
        const i = el.parentElement.querySelector("input");
        const mostrar = i.type === "password";
        i.type = mostrar ? "text" : "password";
        const etiqueta = mostrar ? "Ocultar contraseña" : "Mostrar contraseña";
        el.setAttribute("aria-label", etiqueta);
        el.setAttribute("aria-pressed", String(mostrar));
        el.title = etiqueta;
      }));

      // --- Inicialización ---

      async function init() {
        try {
          const resp = await fetch(`${API_BASE}/config`);
          const config = resp.ok ? await resp.json() : {};
          if (config.login_local) formLogin.classList.add("activo");
          await iniciarMicrosoft(config);
        } catch (err) {
          showError("No se pudo iniciar sesión con Microsoft. Inténtelo de nuevo.");
        }
      }

      init();
    })();
  </script>
</body>
</html>
