<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticketera de Soporte</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="contenedor-principal">
    <!-- Menú sidebar -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <span>Ticketera</span>
      </div>
      <ul class="sidebar-nav">
        <li><a href="index.html" class="enlace-boton activo">Tickets</a></li>
        <li><a href="historial.html" class="enlace-boton">Historial</a></li>
        <li><a href="usuarios.html" class="enlace-boton">Usuarios</a></li>
        <li><a href="ayuda.html" class="enlace-boton">Ayuda</a></li>
      </ul>
    </nav>

    <header class="cabecera">
      <div>
        <h1>Ticketera de Soporte</h1>
        <p>Consulta y gestión de tickets de soporte</p>
        <div id="usuario-bienvenido" class="usuario-bienvenido" hidden>
          <span id="usuario-nombre" class="usuario-nombre"></span>
          <span id="usuario-rol" class="usuario-rol"></span>
        </div>
      </div>
      <nav class="cabecera-enlaces">
        <a href="crear.html" class="enlace-boton">Nuevo ticket</a>
        <a href="usuarios.html" class="enlace-boton">Usuarios</a>
        <button type="button" id="btn-logout" class="enlace-boton" style="border: none; cursor: pointer;">Cerrar sesión</button>
      </nav>
    </header>

    <main class="contenido">
      <form id="form-filtros" class="filtros">
        <label class="campo campo-busqueda">
          <span>Buscar</span>
          <input
            type="search"
            id="search"
            name="search"
            placeholder="Título o descripción"
            autocomplete="off"
          >
        </label>

        <label class="campo">
          <span>Categoría</span>
          <select id="category" name="category">
            <option value="">Todas</option>
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
            <option value="Red">Red</option>
            <option value="Accesos">Accesos</option>
          </select>
        </label>

        <label class="campo">
          <span>Prioridad</span>
          <select id="priority" name="priority">
            <option value="">Todas</option>
            <option value="Baja">Baja</option>
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
            <option value="Crítica">Crítica</option>
          </select>
        </label>

        <label class="campo">
          <span>Estado</span>
          <select id="state" name="state">
            <option value="">Todos</option>
            <option value="Nuevo">Nuevo</option>
            <option value="En proceso">En proceso</option>
            <option value="Resuelto">Resuelto</option>
            <option value="Cerrado">Cerrado</option>
          </select>
        </label>

        <div class="acciones">
          <button type="submit" id="buscar">Buscar</button>
          <button type="button" id="limpiar" class="secundario">Limpiar filtros</button>
          <button type="submit" id="filtrar" class="primario">Filtrar</button>
        </div>
      </form>

      <p id="estado-carga" class="estado" role="status" aria-live="polite" hidden></p>

      <table class="listado">
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Categoría</th>
            <th>Prioridad</th>
            <th>Estado</th>
            <th>Asignado a</th>
            <th>Fecha de creación</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="lista-tickets"></tbody>
      </table>
    </main>
  </div>

  <script src="js/auth.js" defer></script>
  <script src="js/app.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!requireAuth()) return;
      // Mostrar nombre y rol del usuario autenticado
      const user = getUser();
      const bienvenido = document.getElementById("usuario-bienvenido");
      if (user && user.name) {
        const nombreEl = document.getElementById("usuario-nombre");
        const rolEl = document.getElementById("usuario-rol");
        nombreEl.textContent = user.name;
        // Mostrar rol si existe, ocultar si no
        if (user.role) {
          rolEl.textContent = `(${user.role})`;
          rolEl.hidden = false;
        } else {
          rolEl.hidden = true;
        }
        bienvenido.hidden = false;
      }
      const logoutBtn = document.getElementById("btn-logout");
      if (logoutBtn) logoutBtn.addEventListener("click", logout);
    });
  </script>
</body>
</html>
