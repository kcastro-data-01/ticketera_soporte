<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets · American Data Networks</title>
  <!-- Modo oscuro guardado: se aplica antes de pintar (sin destello). -->
  <script>try{if(localStorage.getItem("tema")==="oscuro")document.documentElement.setAttribute("data-tema","oscuro")}catch(e){}</script>
  <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="app">
  <aside class="barra-lateral">
    <a href="index.html" class="marca">
      <img src="images/logo-circular.jpg" alt="" class="marca-logo">
      <span class="marca-texto">
        <span class="marca-nombre">American Data Networks</span>
        <span class="marca-sub">Sistema de tickets</span>
      </span>
    </a>
    <nav class="menu" aria-label="Menú principal">
      <a href="index.html" class="menu-enlace activo" aria-current="page"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4z"/><path d="M13 5v2M13 11v2M13 17v2"/></svg><span>Tickets</span></a>
      <a href="crear.html" class="menu-enlace"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Nuevo ticket</span></a>
      <a href="historial.html" class="menu-enlace" data-permiso="historial_global"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg><span>Historial</span></a>
      <a href="metricas.html" class="menu-enlace" data-permiso="metricas"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Métricas</span></a>
      <a href="usuarios.html" class="menu-enlace" data-permiso="usuarios"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg><span>Usuarios</span></a>
      <a href="ayuda.html" class="menu-enlace"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg><span>Ayuda</span></a>
    </nav>
  </aside>

  <div class="app-principal">
    <header class="cabecera">
      <div>
        <h1 id="titulo-listado">Tickets</h1>
        <p id="subtitulo-listado">Consulta y gestión de los tickets de soporte</p>
      </div>
      <div class="cabecera-acciones">
        <!-- Solo en la vista del Solicitante (app.js lo muestra). -->
        <a href="crear.html" id="nuevo-ticket-solicitante" class="enlace-boton" hidden>Nuevo ticket</a>
      </div>
    </header>

    <main class="contenido">
    <section class="resumen" aria-label="Resumen de tickets">
      <!-- Al pulsar una tarjeta se filtra la tabla por ese estado. -->
      <!-- data-vista="equipo": no se muestra en la vista simple del Solicitante. -->
      <button type="button" class="tarjeta-resumen tono-azul" data-estado="Nuevo" data-vista="equipo" aria-pressed="false">
        <span class="tarjeta-icono" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        <span class="tarjeta-numero" id="res-nuevos">—</span>
        <span class="tarjeta-etiqueta">Nuevos</span>
      </button>
      <button type="button" class="tarjeta-resumen tono-violeta" data-estado="En proceso" data-vista="equipo" aria-pressed="false">
        <span class="tarjeta-icono" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></span>
        <span class="tarjeta-numero" id="res-en-proceso">—</span>
        <span class="tarjeta-etiqueta">En proceso</span>
      </button>
      <button type="button" class="tarjeta-resumen tono-naranja" data-estado="Nuevo,En proceso" aria-pressed="false">
        <span class="tarjeta-icono" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <span class="tarjeta-numero" id="res-pendientes">—</span>
        <span class="tarjeta-etiqueta" id="etq-pendientes">Pendientes</span>
      </button>
      <button type="button" class="tarjeta-resumen tono-verde" data-estado="Resuelto,Cerrado" aria-pressed="false">
        <span class="tarjeta-icono" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg></span>
        <span class="tarjeta-numero" id="res-resueltos">—</span>
        <span class="tarjeta-etiqueta" id="etq-resueltos">Resueltos</span>
      </button>
      <button type="button" class="tarjeta-resumen tono-rojo alerta" data-prioridad="Crítica" data-vista="equipo" aria-pressed="false">
        <span class="tarjeta-icono" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17h.01"/></svg></span>
        <span class="tarjeta-numero" id="res-criticos">—</span>
        <span class="tarjeta-etiqueta">Críticos sin resolver</span>
      </button>
      <button type="button" class="tarjeta-resumen tono-azul destacada" data-mios="true" data-permiso="cambiar_estado" aria-pressed="false">
        <span class="tarjeta-icono" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
        <span class="tarjeta-numero" id="res-mios">—</span>
        <span class="tarjeta-etiqueta">Asignados a mí</span>
      </button>
    </section>

    <div class="vista-tabs" role="group" aria-label="Qué tickets ver" data-permiso="cambiar_estado">
      <button type="button" id="vista-todos" class="vista-tab activa" aria-pressed="true">Todos</button>
      <button type="button" id="vista-mios" class="vista-tab" aria-pressed="false">Mis tickets</button>
    </div>

    <form id="form-filtros" class="filtros">
      <label class="campo campo-busqueda">
        <span>Buscar</span>
        <input
          type="search"
          id="search"
          name="search"
          placeholder="Título o descripción"
          autocomplete="off"
        >
      </label>

      <label class="campo" data-vista="equipo">
        <span>Categoría</span>
        <select id="category" name="category">
          <option value="">Todas</option>
          <option value="Hardware">Hardware</option>
          <option value="Software">Software</option>
          <option value="Red">Red</option>
          <option value="Accesos">Accesos</option>
        </select>
      </label>

      <label class="campo" data-vista="equipo">
        <span>Prioridad</span>
        <select id="priority" name="priority">
          <option value="">Todas</option>
          <option value="Baja">Baja</option>
          <option value="Media">Media</option>
          <option value="Alta">Alta</option>
          <option value="Crítica">Crítica</option>
        </select>
      </label>

      <label class="campo">
        <span>Estado</span>
        <select id="state" name="state">
          <option value="">Todos</option>
          <option value="Nuevo">Nuevo</option>
          <option value="En proceso">En proceso</option>
          <option value="Resuelto">Resuelto</option>
          <option value="Cerrado">Cerrado</option>
          <option value="Nuevo,En proceso" id="opt-pendientes">Pendientes</option>
          <option value="Resuelto,Cerrado" id="opt-resueltos">Resueltos y cerrados</option>
        </select>
      </label>

      <div class="acciones">
        <button type="submit" id="buscar">Buscar</button>
        <button type="button" id="limpiar" class="secundario">Limpiar filtros</button>
      </div>
    </form>

    <!-- Cómo ver el listado; app.js recuerda la elección. El Solicitante
         solo ve la tabla. -->
    <div class="listado-opciones" data-vista="equipo">
      <div class="vista-tabs" role="group" aria-label="Cómo ver los tickets">
        <button type="button" id="ver-tabla" class="vista-tab activa" aria-pressed="true">Tabla</button>
        <button type="button" id="ver-tablero" class="vista-tab" aria-pressed="false">Tablero</button>
      </div>
    </div>

    <p id="estado-carga" class="estado" role="status" aria-live="polite" hidden></p>

    <!-- Solicitante sin tickets: invitación a crear el primero. -->
    <div id="sin-solicitudes" class="estado vacio sin-solicitudes" hidden>
      <p>Todavía no ha creado solicitudes.</p>
      <a href="crear.html" class="enlace-boton">Nuevo ticket</a>
    </div>

    <div class="tabla-scroll" id="tabla-tickets">
      <table class="listado">
        <thead>
          <tr>
            <!-- Las columnas con botón se ordenan al hacer clic (app.js). -->
            <th aria-sort="none"><button type="button" class="orden-columna" data-orden="id">ID</button></th>
            <th aria-sort="none"><button type="button" class="orden-columna" data-orden="title">Título</button></th>
            <th data-vista="equipo">Categoría</th>
            <th data-vista="equipo" aria-sort="none"><button type="button" class="orden-columna" data-orden="priority">Prioridad</button></th>
            <th aria-sort="none"><button type="button" class="orden-columna" data-orden="state">Estado</button></th>
            <th id="th-asignado">Asignado a</th>
            <th aria-sort="none"><button type="button" class="orden-columna" data-orden="created_at">Fecha de creación</button></th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="lista-tickets"></tbody>
      </table>
    </div>

    <!-- Tablero: una columna por estado con los tickets ya cargados (app.js). -->
    <div id="tablero" class="tablero" aria-label="Tickets por estado" hidden></div>

    <nav class="paginacion" id="paginacion" aria-label="Páginas del listado" hidden>
      <button type="button" id="pagina-anterior" class="secundario">← Anterior</button>
      <span id="pagina-info"></span>
      <button type="button" id="pagina-siguiente" class="secundario">Siguiente →</button>
    </nav>
    </main>

    <footer class="pie">© 2026 American Data Networks · Sistema de Tickets</footer>
  </div>

  <script src="js/auth.js" defer></script>
  <script src="js/asistente.js" defer></script>
  <script src="js/app.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      requireAuth();
    });
  </script>
</body>
</html>
