<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo ticket — Ticketera de Soporte</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <div>
      <h1>Ticketera de Soporte</h1>
      <p>Alta de un nuevo ticket</p>
    </div>
    <nav class="cabecera-enlaces">
      <a href="index.html" class="enlace-boton">Volver al listado</a>
    </nav>
  </header>

  <main class="contenido">
    <form id="form-crear" class="filtros formulario" novalidate>
      <label class="campo">
        <span>Título *</span>
        <input
          type="text"
          id="title"
          name="title"
          required
          maxlength="200"
          placeholder="Resumen breve del ticket"
        >
      </label>

      <label class="campo">
        <span>Descripción *</span>
        <textarea
          id="description"
          name="description"
          required
          placeholder="Detalle del problema o de la solicitud"
        ></textarea>
      </label>

      <label class="campo">
        <span>Categoría</span>
        <select id="category" name="category">
          <option value="Incidente">Incidente</option>
          <option value="Consulta">Consulta</option>
          <option value="Solicitud">Solicitud</option>
          <option value="Mantenimiento">Mantenimiento</option>
        </select>
      </label>

      <label class="campo">
        <span>Prioridad</span>
        <select id="priority" name="priority">
          <option value="Baja">Baja</option>
          <option value="Media">Media</option>
          <option value="Alta">Alta</option>
          <option value="Crítica">Crítica</option>
        </select>
      </label>

      <div class="acciones">
        <button type="submit" id="guardar">Crear ticket</button>
      </div>
    </form>

    <p id="estado-carga" class="estado" role="status" aria-live="polite" hidden></p>
  </main>

  <script src="js/crear.js" defer></script>
</body>
</html>
