<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo ticket — Ticketera de Soporte</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <div>
      <img src="images/logo-corporativo.png" alt="American Data Networks" class="cabecera-logo">
      <h1>Ticketera de Soporte</h1>
      <p>Alta de un nuevo ticket</p>
    </div>
    <nav class="cabecera-enlaces">
      <a href="index.html" class="enlace-boton">Volver al listado</a>
      <a href="usuarios.html" class="enlace-boton">Usuarios</a>
      <button type="button" id="btn-logout" class="enlace-boton" style="border: none; cursor: pointer;">Cerrar sesión</button>
    </nav>
  </header>

  <main class="contenido">
    <form id="form-crear" class="filtros formulario" novalidate>
      <label class="campo">
        <span>Título *</span>
        <input
          type="text"
          id="title"
          name="title"
          required
          maxlength="200"
          placeholder="Resumen breve del ticket"
        >
      </label>

      <label class="campo">
        <span>Descripción *</span>
        <textarea
          id="description"
          name="description"
          required
          placeholder="Detalle del problema o de la solicitud"
        ></textarea>
      </label>

      <label class="campo">
        <span>Categoría</span>
        <select id="category" name="category">
          <option value="Hardware">Hardware</option>
          <option value="Software">Software</option>
          <option value="Red">Red</option>
          <option value="Accesos">Accesos</option>
        </select>
      </label>

      <label class="campo">
        <span>Prioridad</span>
        <select id="priority" name="priority">
          <option value="Baja">Baja</option>
          <option value="Media">Media</option>
          <option value="Alta">Alta</option>
          <option value="Crítica">Crítica</option>
        </select>
      </label>

      <div class="acciones">
        <button type="submit" id="guardar">Crear ticket</button>
      </div>
    </form>

    <p id="estado-carga" class="estado" role="status" aria-live="polite" hidden></p>
  </main>

  <script src="js/auth.js" defer></script>
  <script src="js/crear.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!requireAuth()) return;
      var logoutBtn = document.getElementById("btn-logout");
      if (logoutBtn) logoutBtn.addEventListener("click", logout);
    });
  </script>
</body>
</html>
