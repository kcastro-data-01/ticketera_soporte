<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Página no encontrada · American Data Networks</title>
  <!-- Modo oscuro guardado: se aplica antes de pintar (sin destello). -->
  <script>try{if(localStorage.getItem("tema")==="oscuro")document.documentElement.setAttribute("data-tema","oscuro")}catch(e){}</script>
  <!-- Rutas absolutas: el servidor muestra esta página para cualquier dirección que no existe, también en subcarpetas. -->
  <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="pagina-error">
  <main class="pagina-error-tarjeta">
    <div class="pagina-error-marca">
      <img src="/images/logo-circular.jpg" alt="">
      <span>American Data Networks</span>
    </div>
    <span class="pagina-error-icono icono-buscar" aria-hidden="true"></span>
    <p class="pagina-error-codigo">Error 404</p>
    <h1>Página no encontrada</h1>
    <p class="pagina-error-mensaje">La dirección que buscó no existe o fue movida. Verifique el enlace o regrese al inicio.</p>
    <div class="acciones">
      <a href="/index.html" class="enlace-boton">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
