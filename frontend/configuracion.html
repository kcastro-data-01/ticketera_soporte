<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración — Ticketera de Soporte</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="contenedor-principal">
    <!-- Menú sidebar -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <span>Ticketera</span>
      </div>
      <ul class="sidebar-nav">
        <li><a href="index.html" class="enlace-boton">Inicio</a></li>
        <li><a href="index.html" class="enlace-boton">Tickets</a></li>
        <li><a href="historial.html" class="enlace-boton">Historial</a></li>
        <li><a href="usuarios.html" class="enlace-boton">Usuarios</a></li>
        <li><a href="configuracion.html" class="enlace-boton activo">Configuración</a></li>
      </ul>
    </nav>

    <header class="cabecera">
      <div>
        <h1>Configuración del sistema</h1>
        <p>Constantes y opciones disponibles en la ticketera</p>
      </div>
      <nav class="cabecera-enlaces">
        <a href="index.html" class="enlace-boton">Volver al inicio</a>
      </nav>
    </header>

    <main class="contenido">
      <p id="estado-carga" class="estado" role="status" aria-live="polite" hidden></p>

      <section class="seccion" aria-label="Categorías">
        <h2>Categorías de tickets</h2>
        <ul id="lista-categorias" class="lista-constantes"></ul>
      </section>

      <section class="seccion" aria-label="Estados">
        <h2>Estados del ticket</h2>
        <ul id="lista-estados" class="lista-constantes"></ul>
      </section>

      <section class="seccion" aria-label="Prioridades">
        <h2>Prioridades</h2>
        <ul id="lista-prioridades" class="lista-constantes"></ul>
      </section>

      <section class="seccion" aria-label="Roles">
        <h2>Roles de usuario</h2>
        <ul id="lista-roles" class="lista-constantes"></ul>
      </section>
    </main>
  </div>

  <script src="js/configuracion.js" defer></script>
</body>
</html>
